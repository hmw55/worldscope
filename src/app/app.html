<div class="app-shell">
  <header class="topbar">
    <a class="brand" href="/" aria-label="WorldScope home">
      <span class="brand-mark" aria-hidden="true">
        <span class="brand-orbit"></span>
      </span>

      <span class="brand-copy">
        <span class="brand-name">WorldScope</span>
        <span class="brand-tagline">Global Data Explorer</span>
      </span>
    </a>

    <div class="search-shell">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input
        type="search"
        placeholder="Search countries..."
        aria-label="Search countries"
        disabled
      />
      <span class="coming-soon">Coming soon</span>
    </div>

    <nav class="topbar-nav" aria-label="Primary navigation">
      <a href="#about">About</a>
    </nav>
  </header>

  <main class="dashboard">
    <aside class="country-column" aria-label="Country information">
      <app-country-panel
        [selectedCountry]="selectedCountry()"
        [countryDetails]="countryDetails()"
        [isLoading]="isCountryLoading()"
        [hasError]="hasCountryError()"
      />

      <app-quick-stats-panel
        [hasSelection]="selectedCountry() !== null"
        [stats]="quickStats()"
        [isLoading]="areQuickStatsLoading()"
        [hasError]="hasQuickStatsError()"
      />
    </aside>

    <section class="map-column" aria-label="World map">
      <div class="map-toolbar">
        <div>
          <span class="panel-label">World Map</span>
          <p>Explore countries and global development data</p>
        </div>

        <span class="data-source">World Bank Data</span>
      </div>

      <div class="map-workspace">
        <app-world-map 
          (countrySelected)="onCountrySelected($event)"
        />
      </div>
    </section>

    <aside class="data-column" aria-label="Country indicators">
      <app-indicators-panel
        [hasSelection]="selectedCountry() !== null"
        [indicators]="developmentIndicators()"
        [selectedIndicator]="selectedIndicator()"
        [isLoading]="areDevelopmentIndicatorsLoading()"
        [hasError]="hasDevelopmentIndicatorsError()"
        (indicatorSelected)="selectIndicator($event)"
      />

      <app-trend-panel
        [selectedIndicator]="selectedIndicator()"
        [observations]="indicatorHistory()"
        [isLoading]="isIndicatorHistoryLoading()"
        [hasError]="hasIndicatorHistoryError()"
      />
    </aside>
  </main>

  <footer class="statusbar" id="about">
    <span>
      <span class="status-dot"></span>
      WorldScope
    </span>

    <span>Global development data explorer</span>
  </footer>
</div>
